# Definicion de servicios y puertos para PiruluGCP (Nginx Proxy + Apache Backend)

SERVICE_NGINX="nginx"
SERVICE_APACHE="apache2"
SERVICE_MARIADB="mariadb"
APACHE_BACKEND_PORT=8080
PANEL_PORT=8083

CMD_SYSTEMCTL="/bin/systemctl"
CMD_NGINX="/usr/sbin/nginx"
CMD_A2ENSITE="/usr/sbin/a2ensite"
CMD_A2DISSITE="/usr/sbin/a2dissite"
CMD_APACHE2CTL="/usr/sbin/apache2ctl"
CMD_MYSQL="/usr/bin/mysql"
CMD_CERTBOT="/usr/bin/certbot"

NGINX_SITES_AVAILABLE="/etc/nginx/sites-available"
NGINX_SITES_ENABLED="/etc/nginx/sites-enabled"
APACHE_SITES_AVAILABLE="/etc/apache2/sites-available"
APACHE_SITES_ENABLED="/etc/apache2/sites-enabled"
PHPMYADMIN_DIR="/usr/share/phpmyadmin"
