# Configuracion general de PiruluGCP

PANEL_NAME="PiruluGCP"
PANEL_PORT=8083
PANEL_SSL=false
PANEL_ROOT="/usr/local/pirulugcp"
PANEL_DATA="/var/lib/pirulugcp"
PANEL_SECRET="pirulugcp_secret_key_change_me"
DEFAULT_WEB_SERVER="nginx"
DEFAULT_USER_HOME="/home"
DEFAULT_PHP_VERSION="8.2"
AVAILABLE_PHP_VERSIONS="7.4,8.0,8.1,8.2,8.3,8.4,8.5"
NGINX_SITES_AVAILABLE="/etc/nginx/sites-available"
NGINX_SITES_ENABLED="/etc/nginx/sites-enabled"
APACHE_SITES_AVAILABLE="/etc/apache2/sites-available"
APACHE_SITES_ENABLED="/etc/apache2/sites-enabled"
PHP_FPM_POOL_DIR="/etc/php/%VERSION%/fpm/pool.d"
LOG_DIR="/var/log/pirulugcp"
PMA_URL="/phpmyadmin"
